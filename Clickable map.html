<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kolkata Constituency Map</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#f5f0e8;--ink:#1a1209;--gold:#b8860b;--paper:#ede8dc;--shadow:rgba(26,18,9,0.2)}
body{background:var(--cream);font-family:'Source Sans 3',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 48px}
header{text-align:center;margin-bottom:22px}
header h1{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,3vw,2rem);color:var(--ink);letter-spacing:.02em}
header p{font-size:.85rem;color:#6b5d4a;margin-top:5px;letter-spacing:.04em}
.map-container{position:relative;display:inline-block}
.map-container img{display:block;max-width:680px;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hit{position:absolute;cursor:pointer;z-index:2}
.hit:hover::after{content:'';position:absolute;inset:0;background:rgba(184,134,11,0.22);border:2px solid rgba(184,134,11,0.75);border-radius:3px}
#overlay{display:none;position:fixed;inset:0;background:rgba(26,18,9,.45);z-index:1000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
#overlay.on{display:flex}
#popup{background:var(--paper);border:1px solid var(--gold);border-radius:12px;max-width:460px;width:100%;padding:30px 26px 22px;position:relative;box-shadow:0 12px 40px var(--shadow);animation:pop .22s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.88) translateY(12px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
#cls{position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.5rem;color:#8b7355;cursor:pointer;line-height:1}
#cls:hover{color:#8b3a0f}
#badge{display:inline-block;background:var(--gold);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:20px;padding:3px 12px;margin-bottom:10px}
#pname{font-family:'Playfair Display',serif;font-size:1.55rem;color:var(--ink);margin-bottom:12px;line-height:1.2}
hr{border:none;border-top:1px solid rgba(184,134,11,.3);margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:14px}
.field label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:#8b7355;margin-bottom:2px;font-weight:600}
.field span{font-size:.92rem;color:var(--ink);font-weight:500}
.info-box{background:rgba(184,134,11,.07);border-left:3px solid var(--gold);border-radius:4px;padding:10px 13px;font-size:.86rem;color:#4a3728;line-height:1.55}
.hint{text-align:center;font-size:.78rem;color:#8b7355;margin-top:16px}
</style>
</head>

  cossipore:{name:"Cossipore-Belgachia",parl:"Kolkata Uttar",no:"1",dist:"Kolkata",res:"No",info:"Located at the northern tip of Kolkata, this segment covers Cossipore and Belgachia — home to the historic Cossipore Gun & Shell Factory. The Cossipore Garden House, where Ramakrishna Paramahansa spent his final days, is a major heritage landmark here."},
  shyampukur:{name:"Shyampukur",parl:"Kolkata Uttar",no:"2",dist:"Kolkata",res:"No",info:"A densely populated North Kolkata constituency famed for vibrant Durga Puja celebrations. The Shyampukur Bati, where Ramakrishna Paramahansa was treated before his passing, is a significant historical site in this segment."},
  manicktala:{name:"Manicktala",parl:"Kolkata Uttar",no:"3",dist:"Kolkata",res:"No",info:"Situated in northeast Kolkata, Manicktala is a bustling commercial segment anchored by the famous Manicktala market. It also hosts several major hospitals and is a key transit point in the northern city."},
  jorasanko:{name:"Jorasanko",parl:"Kolkata Uttar",no:"4",dist:"Kolkata",res:"No",info:"Home to Jorasanko Thakur Bari — the ancestral mansion of the Tagore family and birthplace of Nobel laureate Rabindranath Tagore, now a celebrated museum. The segment is deeply rooted in the Bengali cultural renaissance."},
  chowrangee:{name:"Chowrangee",parl:"Kolkata Uttar",no:"5",dist:"Kolkata",res:"No",info:"Covers the iconic Chowringhee–Dharmatala corridor, the commercial and cultural heart of Kolkata. Includes Esplanade, New Market, major theatres along Rabindra Sarani, and surrounded by significant government offices."},
  beliaghata:{name:"Beliaghata",parl:"Kolkata Uttar",no:"6",dist:"Kolkata",res:"No",info:"Located in eastern Kolkata, Beliaghata is known for its canal network and the Beliaghata Phansi Ghat area. A historically mixed industrial-residential zone with strong local cultural traditions."},
  entally:{name:"Entally",parl:"Kolkata Uttar",no:"7",dist:"Kolkata",res:"No",info:"An ethnically diverse constituency in central-east Kolkata with a large minority population. Known for bustling markets and proximity to the Sealdah railway corridor and Central Avenue."},
  kolkata_port:{name:"Kolkata Port",parl:"Kolkata Dakshin",no:"8",dist:"Kolkata",res:"No",info:"Encompasses the historic Syama Prasad Mookerjee Port, one of India's oldest major ports. Includes the Garden Reach industrial belt, riverside ghats, and the Metiabruz area with its distinct cultural character."},
  bhowanipore:{name:"Bhowanipore",parl:"Kolkata Dakshin",no:"9",dist:"Kolkata",res:"No",info:"A prestigious South Kolkata constituency associated with Chief Minister Mamata Banerjee. Features the Netaji Bhawan memorial and is considered one of Kolkata's key political, cultural, and residential hubs."},
  ballygunge:{name:"Ballygunge",parl:"Kolkata Dakshin",no:"10",dist:"Kolkata",res:"No",info:"One of Kolkata's most affluent constituencies, featuring upscale residences, elite schools, and the iconic Gariahat market. Ballygunge Phari is a major commercial and social landmark of South Kolkata."},
  rasbehari:{name:"Rasbehari",parl:"Kolkata Dakshin",no:"11",dist:"Kolkata",res:"No",info:"Named after Rashbehari Avenue, a major artery of South Kolkata. Includes Deshapriya Park — famous for hosting Asia's largest Durga Puja — and the historic Hazra area."},

// Areas: [left%, top%, width%, height%] matched to visible regions in the map image
const AREAS=[
  {id:"cossipore",    l:36, t:0,  w:35, h:18},
  {id:"manicktala",  l:57, t:2,  w:35, h:24},
  {id:"shyampukur",  l:31, t:13, w:28, h:14},
  {id:"jorasanko",   l:28, t:22, w:29, h:14},
  {id:"beliaghata",  l:57, t:18, w:40, h:26},
  {id:"chowrangee",  l:21, t:29, w:31, h:19},
  {id:"entally",     l:44, t:32, w:32, h:21},
  {id:"kolkata_port",l:1,  t:39, w:30, h:27},
  {id:"bhowanipore", l:23, t:45, w:30, h:18},
  {id:"ballygunge",  l:43, t:43, w:35, h:22},
  {id:"rasbehari",   l:19, t:58, w:40, h:18},
  {id:"kasba",       l:54, t:49, w:43, h:26},
  {id:"behala_west", l:1,  t:62, w:34, h:30},
  {id:"behala_east", l:19, t:67, w:42, h:32},
];

const mc=document.getElementById('mc');
const img=document.getElementById('img');
const overlay=document.getElementById('overlay');

function build(){
  mc.querySelectorAll('.hit').forEach(e=>e.remove());
  const W=img.offsetWidth, H=img.offsetHeight;
  AREAS.forEach(a=>{
    const d=document.createElement('div');
    d.className='hit';
    d.title=DATA[a.id].name;
    d.style.left=(a.l/100*W)+'px';
    d.style.top=(a.t/100*H)+'px';
    d.style.width=(a.w/100*W)+'px';
    d.style.height=(a.h/100*H)+'px';
    d.addEventListener('click',()=>openPopup(a.id));
    mc.appendChild(d);
  });
}

function openPopup(id){
  const c=DATA[id];
  document.getElementById('pname').textContent=c.name;
  document.getElementById('fparl').textContent=c.parl;
  document.getElementById('fno').textContent=c.no;
  document.getElementById('fdist').textContent=c.dist;
  document.getElementById('fres').textContent=c.res;
  document.getElementById('finfo').textContent=c.info;
  overlay.classList.add('on');
}
document.getElementById('cls').onclick=()=>overlay.classList.remove('on');
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('on');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('on');});

const ro=new ResizeObserver(build);
ro.observe(img);
img.addEventListener('load',build);
if(img.complete)build();
</script>
</body>
